; PlatformIO Configuration for Music LED Strip
; ESP32-S3 based audio-reactive wearable LED controller

[env:esp32s3]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200

; Partition scheme with enough space for SPIFFS logging
board_build.partitions = default_8MB.csv

; USB CDC for serial output (ESP32-S3 native USB)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    fastled/FastLED@^3.6.0
    kosme/arduinoFFT@^2.0.2
    h2zero/NimBLE-Arduino@^1.4.1
    ;me-no-dev/ESP Async WebServer@^1.2.3
    bblanchon/ArduinoJson@^7.0.0

; ESP32-WROOM-32 build (real hardware, real I2S mic, no S3-specific flags)
[env:esp32wroom32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    fastled/FastLED@^3.6.0
    kosme/arduinoFFT@^2.0.2

; Wokwi simulator build (no I2S hardware, uses simulated audio)
[env:wokwi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DSIMULATE_AUDIO=1
    -DBTN_LONG_PRESS_MS=5000
lib_deps =
    fastled/FastLED@^3.6.0
    kosme/arduinoFFT@^2.0.2
