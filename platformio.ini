; PlatformIO Configuration for Music LED Strip
; Target hardware: ESP32-WROOM-32 module (ESP32-D0WD-V3 chip, dual core, 4MB flash)

[platformio]
default_envs = esp32wroom32

; Real hardware: ESP32-WROOM-32 / ESP32-D0WD-V3, real I2S microphone.
[env:esp32wroom32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    fastled/FastLED@^3.6.0
    kosme/arduinoFFT@^2.0.2
; Uncomment when src/ble/ and src/web/ land. They are left out for now so the
; build stays small and link times stay short.
;   h2zero/NimBLE-Arduino@^1.4.1
;   bblanchon/ArduinoJson@^7.0.0

; Host-side unit tests: pio test -e native
; Compiles beat_detector.cpp against a stub Arduino.h so the audio pipeline can
; be exercised without hardware.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -I test/stubs
    -I src
build_src_filter = +<audio/beat_detector.cpp>

; Wokwi simulator build (no I2S hardware, uses simulated audio)
[env:wokwi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DSIMULATE_AUDIO=1
    -DBTN_LONG_PRESS_MS=5000
lib_deps =
    fastled/FastLED@^3.6.0
    kosme/arduinoFFT@^2.0.2
